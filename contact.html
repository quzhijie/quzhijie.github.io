<!DOCTYPE html>
<html>
<title>Contact - Zhijie Qu</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="./css/style.css">
<style>
  /* Page-specific: hero image */
  .bgimg-1 {
    background-image: url('./images/horsehead.jpg');
    min-height: 250px;
  }
</style>

<body>

<!-- Navbar (sit on top) -->
<div class="w3-top">
  <div class="w3-bar" id="myNavbar">
    <a href="./index.html" class="w3-bar-item w3-button w3-hide-small w3-white"> HOME </a>
    <a href="./cv.html" class="w3-bar-item w3-button w3-hide-small w3-white"><i class="fa fa-user"></i> VITAE</a>
    <a href="./research.html" class="w3-bar-item w3-button w3-hide-small w3-white"><i class="fa fa-search"></i>RESEARCH</a>
    <a href="#home" class="w3-bar-item w3-button w3-black" onclick="toggleFunction()"><i class="fa fa-envelope"></i> CONTACT &#9660;</a>
  </div>

  <!-- Navbar on small screens -->
  <div id="navDemo" class="w3-bar-block w3-black w3-hide w3-hide-large w3-hide-medium">
    <a href="./index.html" class="w3-bar-item w3-button" onclick="toggleFunction()">HOME</a>
    <a href="./cv.html" class="w3-bar-item w3-button" onclick="toggleFunction()">VITAE</a>
    <a href="./research.html" class="w3-bar-item w3-button" onclick="toggleFunction()">RESEARCH</a>
    <a href="#home" class="w3-bar-item w3-button" onclick="toggleFunction()">CONTACT</a>
  </div>
</div>

<!-- First Parallax Image -->
<div class="bgimg-1 w3-display-container w3-opacity-min" id="home">
</div>

<!-- Contact Info -->
<div class="ex2 w3-container w3-center w3-cell-middle">
  <h1 style="color:black"> CONTACT </h1>
  <p> Department of Astronomy E304 </p>
  <p> Physics Building, Tsinghua University </p>
  <p> Beijing, China </p>
  <p> quzhijie (at) tsinghua.edu.cn </p>
  <p> quzhijie.astro (at) gmail.com </p>
</div>

<!-- Footer -->
<footer class="w3-center w3-black w3-padding-16 w3-opacity w3-hover-opacity-off">
  <p style="font-family: 'Crimson Text', serif; text-transform: capitalize"> Zhijie Qu | Tsinghua University</p>
</footer>

<script>
// Modal Image Gallery
function onClick(element) {
  document.getElementById("img01").src = element.src;
  document.getElementById("modal01").style.display = "block";
  var captionText = document.getElementById("caption");
  captionText.innerHTML = element.alt;
}

// Change style of navbar on scroll
window.onscroll = function() {myFunction()};
function myFunction() {
  var navbar = document.getElementById("myNavbar");
  if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
    navbar.className = "w3-bar" + " w3-card" + " w3-animate-top" + " w3-white";
  } else {
    navbar.className = navbar.className.replace(" w3-card w3-animate-top w3-white", "");
  }
}

// Used to toggle the menu on small screens when clicking on the menu button
function toggleFunction() {
  var x = document.getElementById("navDemo");
  if (x.className.indexOf("w3-show") == -1) {
    x.className += " w3-show";
  } else {
    x.className = x.className.replace(" w3-show", "");
  }
}
</script>

</body>
</html>
